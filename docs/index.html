  <!-- Top Glass Navigation -->

    <div class="nav-inner">
      <div class="brand-group">

            <circle cx="16" cy="16" r="13" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="2"/>
            <circle cx="16" cy="16" r="8" fill="none" stroke="#a855f7" stroke-opacity="0.5" stroke-width="2"/>
            <circle cx="16" cy="16" r="3.5" fill="#6366f1"/>

    <!-- Controls & Multi-Filters (HF-055: Cohesive Dropdown Controls) -->
    <div class="controls-deck">
      <!-- Unified Command & Dropdown Filter Toolbar -->
      <div class="filter-toolbar" id="filter-toolbar">
        <!-- Integrated Search Bar -->
        <div class="search-input-wrapper">
          <span class="search-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="text" id="search-input" placeholder="Search by title, company, skills, or city...">
          <span class="kbd-shortcut">/</span>
        </div>

        <!-- Dropdowns Filter Controls -->
        <div class="filter-dropdowns-group">
          <!-- Role Select -->
          <div class="select-wrapper">
            <select id="role-select" class="portal-select" aria-label="Filter by Target Profile / Role">
              <option value="all">All Roles (291)</option>
              <option value="power-platform">Power Platform (47)</option><option value="full-stack">Full Stack (144)</option><option value="java-backend">Java &amp; Spring Boot (80)</option><option value="plsql-developer">PL/SQL (20)</option>
            </select>
          </div>

          <!-- Status Select -->
          <div class="select-wrapper">
            <select id="status-select" class="portal-select" aria-label="Filter by Tracker Status">
              <option value="all">All Active</option>
              <option value="saved">Saved (<span id="status-saved-badge">0</span>)</option>
              <option value="applied">Applied (<span id="status-applied-badge">0</span>)</option>
            </select>
          </div>

          <!-- Region Select (No 'Priority' - HF-055) -->
          <div class="select-wrapper">
            <select id="tier-select" class="portal-select" aria-label="Filter by Region">
              <option value="all">All Regions</option>
              <option value="domestic">Domestic</option>
              <option value="remote">Remote</option>
            </select>
          </div>

          <!-- Timeline Select -->
          <div class="select-wrapper">
            <select id="date-select" class="portal-select" aria-label="Filter by Timeline">
              <option value="all">All Dates</option>
              <option value="today">Today's Batch</option>
              <option value="yesterday">Yesterday</option>
            </select>
          </div>

          <!-- Reset Filter Button -->
          <button class="chip-reset-btn" id="filter-reset-btn" title="Reset all filters" style="display: none;">
            ✕ Reset
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Feed Area -->
  <main class="content-area" id="listings-container">
    <!-- Injected dynamically by JavaScript -->
  </main>

  <!-- Clean Minimalist Footer (HF-063) -->
  <footer class="portal-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="gradient-text font-bold">Job Radar Portal</span>
        <span class="footer-divider">•</span>
        <span>Automated Candidate Intelligence</span>
      </div>
    </div>
  </footer>

  <!-- Slide-Over Job Detail Drawer (HF-039) -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="job-drawer" id="job-drawer">
    <div class="drawer-header">
      <div class="table-company-cell">
        <div class="monogram-sm" id="drawer-company-monogram">C</div>
        <div>
          <div id="drawer-company" style="font-size: 13px; font-weight: 700; color: var(--text-muted);">Company</div>
          <h2 id="drawer-title" style="font-size: 18px; font-weight: 800; color: var(--text-main); line-height: 1.3;">Job Title</h2>
        </div>
      </div>
      <button class="drawer-close-btn" id="drawer-close" title="Close Drawer (Esc)">✕</button>
    </div>
    <div class="drawer-body">
      <div id="drawer-badges" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;"></div>
      <div id="drawer-location" style="font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px;"></div>
      <div id="drawer-skills" style="display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0;"></div>
      <div class="drawer-desc" id="drawer-description"></div>
    </div>
    <div class="drawer-footer">
      <div class="card-action-group">
        <button class="action-icon-btn" id="drawer-save-btn" data-action="save" onclick="event.stopPropagation();">⭐ Save</button>
        <button class="action-icon-btn" id="drawer-applied-btn" data-action="applied" onclick="event.stopPropagation();">✅ Applied</button>
      </div>
      <a href="#" target="_blank" rel="noopener noreferrer" class="btn-apply-cta" id="drawer-apply-link" onclick="event.stopPropagation();">
        Apply Now ↗
      </a>
    </div>
  </aside>

  <!-- Toast Container (HF-041) -->
  <div class="toast-container">
    <div class="toast-pill" id="toast-notification">
      <span id="toast-icon">✨</span>
      <span id="toast-message">Action saved</span>
    </div>
  </div>
