<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Radar Rings -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1.2"/>
  <circle cx="16" cy="16" r="7" fill="none" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2"/>
  <circle cx="16" cy="16" r="3.2" fill="url(#coreGrad)"/>

  <!-- Radar Crosshairs -->
  <line x1="16" y1="5" x2="16" y2="27" stroke="#6366f1" stroke-opacity="0.2" stroke-width="0.8"/>
  <line x1="5" y1="16" x2="27" y2="16" stroke="#6366f1" stroke-opacity="0.2" stroke-width="0.8"/>

  <!-- Scanning Sector Beam -->
  <path d="M16 16 L25 9 A11 11 0 0 0 16 5 Z" fill="url(#radarSweep)"/>

  <!-- Active Detected Role Blip -->
  <circle cx="21" cy="9" r="2.2" fill="#10b981"/>
  <circle cx="21" cy="9" r="3.5" fill="none" stroke="#10b981" stroke-opacity="0.6" stroke-width="0.8"/>
