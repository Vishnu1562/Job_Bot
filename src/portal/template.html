<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Job Radar Portal • Modern Candidate Intelligence Portal</title>
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Job Radar">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top Glass Navigation -->
  <header class="top-navbar">
    <div class="nav-inner">
      <div class="brand-group">
        <a href="#" class="brand-logo">
          <svg class="brand-icon-svg" viewBox="0 0 32 32" width="24" height="24" style="vertical-align: middle; flex-shrink: 0;">
            <circle cx="16" cy="16" r="13" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="2"/>
            <circle cx="16" cy="16" r="8" fill="none" stroke="#a855f7" stroke-opacity="0.5" stroke-width="2"/>
            <circle cx="16" cy="16" r="3.5" fill="#6366f1"/>
            <path d="M16 16 L26 8 A13 13 0 0 0 16 3 Z" fill="url(#radarSweep)" opacity="0.6"/>
            <circle cx="21" cy="9" r="2.5" fill="#10b981"/>
          </svg>
          <span class="gradient-text">Job Radar Portal</span>
        </a>
        <div class="live-dot-badge">
          <span class="live-pulse"></span>
          Live Feed
        </div>
        <div class="sync-time-badge" title="Last automated job radar scan">
          ⚡ Synced: {{LAST_SYNCED_TIME}}
        </div>
      </div>
      <div class="nav-actions">
        <!-- Dark / Light Theme Toggle (HF-038) -->
        <button class="icon-btn" id="theme-toggle" title="Toggle Light / Dark Mode" data-action="toggle-theme">
          🌙
        </button>
      </div>
    </div>
  </header>

  <!-- Hero & Live KPI Summary Bar (HF-038 & HF-049) -->
  <div class="hero-container" id="app">
    <!-- @portal:app -->
    <div class="kpi-grid" id="kpi-stats-bar">
      <div class="kpi-card">
        <div class="kpi-icon-wrap" style="background: rgba(99, 102, 241, 0.15); color: #818cf8;">
          <svg class="kpi-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
        </div>
        <div>
          <div class="kpi-stat-value" id="kpi-total-jobs">{{TOTAL_JOBS_COUNT}}</div>
          <div class="kpi-stat-label">Total Active Roles</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon-wrap" style="background: rgba(244, 63, 94, 0.15); color: #fb7185;">
          <svg class="kpi-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div>
          <div class="kpi-stat-value" id="kpi-today-jobs">0</div>
          <div class="kpi-stat-label">New in Today's Batch</div>
        </div>
      </div>
    </div>

    <!-- Controls & Multi-Filters (HF-055: Cohesive Dropdown Controls) -->
    <div class="controls-deck">
      <!-- Unified Command & Dropdown Filter Toolbar -->
      <div class="filter-toolbar" id="filter-toolbar">
        <!-- Integrated Search Bar -->
        <div class="search-input-wrapper">
          <span class="search-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="text" id="search-input" placeholder="Search by title, company, skills, or city...">
          <span class="kbd-shortcut">/</span>
        </div>

        <!-- Dropdowns Filter Controls -->
        <div class="filter-dropdowns-group">
          <!-- Role Select -->
          <div class="select-wrapper">
            <select id="role-select" class="portal-select" aria-label="Filter by Target Profile / Role">
              <option value="all">All Roles ({{TOTAL_JOBS_COUNT}})</option>
              {{PROFILE_OPTIONS}}
            </select>
          </div>

          <!-- Status Select -->
          <div class="select-wrapper">
            <select id="status-select" class="portal-select" aria-label="Filter by Tracker Status">
              <option value="all">All Active</option>
              <option value="saved">Saved (<span id="status-saved-badge">0</span>)</option>
              <option value="applied">Applied (<span id="status-applied-badge">0</span>)</option>
            </select>
          </div>

          <!-- Region Select (No 'Priority' - HF-055) -->
          <div class="select-wrapper">
            <select id="tier-select" class="portal-select" aria-label="Filter by Region">
              <option value="all">All Regions</option>
              <option value="domestic">Domestic</option>
              <option value="remote">Remote</option>
            </select>
          </div>

          <!-- Timeline Select -->
          <div class="select-wrapper">
            <select id="date-select" class="portal-select" aria-label="Filter by Timeline">
              <option value="all">All Dates</option>
              <option value="today">Today's Batch</option>
              <option value="yesterday">Yesterday</option>
            </select>
          </div>

          <!-- Reset Filter Button -->
          <button class="chip-reset-btn" id="filter-reset-btn" title="Reset all filters" style="display: none;">
            ✕ Reset
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Feed Area -->
  <main class="content-area" id="listings-container">
    <!-- Injected dynamically by JavaScript -->
  </main>

  <!-- Slide-Over Job Detail Drawer (HF-039) -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="job-drawer" id="job-drawer">
    <div class="drawer-header">
      <div class="table-company-cell">
        <div class="monogram-sm" id="drawer-company-monogram">C</div>
        <div>
          <div id="drawer-company" style="font-size: 13px; font-weight: 700; color: var(--text-muted);">Company</div>
          <h2 id="drawer-title" style="font-size: 18px; font-weight: 800; color: var(--text-main); line-height: 1.3;">Job Title</h2>
        </div>
      </div>
      <button class="drawer-close-btn" id="drawer-close" title="Close Drawer (Esc)">✕</button>
    </div>
    <div class="drawer-body">
      <div id="drawer-badges" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;"></div>
      <div id="drawer-location" style="font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px;"></div>
      <div id="drawer-skills" style="display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0;"></div>
      <div class="drawer-desc" id="drawer-description"></div>
    </div>
    <div class="drawer-footer">
      <div class="card-action-group">
        <button class="action-icon-btn" id="drawer-save-btn" data-action="save" onclick="event.stopPropagation();">⭐ Save</button>
        <button class="action-icon-btn" id="drawer-applied-btn" data-action="applied" onclick="event.stopPropagation();">✅ Applied</button>
      </div>
      <a href="#" target="_blank" rel="noopener noreferrer" class="btn-apply-cta" id="drawer-apply-link" onclick="event.stopPropagation();">
        Apply Now ↗
      </a>
    </div>
  </aside>

  <!-- Toast Container (HF-041) -->
  <div class="toast-container">
    <div class="toast-pill" id="toast-notification">
      <span id="toast-icon">✨</span>
      <span id="toast-message">Action saved</span>
    </div>
  </div>

  <!-- Embedded JSON Bootstrap for Offline & Local File Fallback (EC-021) -->
  <script id="portal-data" type="application/json">
{{PORTAL_DATA_JSON}}
  </script>

  <script defer src="app.js"></script>
</body>
</html>
