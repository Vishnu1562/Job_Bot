name: Power Platform Job Radar

on:
  schedule:
    # Runs every morning at 8:35 AM IST (03:05 UTC) - off-peak minute to avoid GitHub runner queue delays
    - cron: '5 3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write # Needed to commit jobs.db back to the repository

concurrency:
  group: job-radar-lock
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Test Suite
        run: npm test

      - name: Execute Job Radar & Dispatch Digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RECIPIENT_EMAIL_POWERPLATFORM: ${{ secrets.RECIPIENT_EMAIL_POWERPLATFORM }}
          RECIPIENT_EMAIL_FULLSTACK: ${{ secrets.RECIPIENT_EMAIL_FULLSTACK }}
          RECIPIENT_EMAIL_JAVA: ${{ secrets.RECIPIENT_EMAIL_JAVA }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: npm start

      - name: Persist jobs.db Deduplication Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore(db): persist jobs.db after daily radar scan [skip ci]"
            git push
          fi
