name: Multi-Profile Job Radar

on:
  workflow_dispatch: # Punctual daily trigger via external webhook (cron-job.org at 8:35 AM IST) & manual UI runs
    inputs:
      force_dispatch:
        description: 'Force email dispatch even if already sent today'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # Needed to commit jobs.db back to the repository

concurrency:
  group: job-radar-lock
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Test Suite
        run: npm test

      - name: Execute Job Radar & Dispatch Digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RECIPIENT_EMAIL_POWERPLATFORM: ${{ secrets.RECIPIENT_EMAIL_POWERPLATFORM }}
          RECIPIENT_EMAIL_FULLSTACK: ${{ secrets.RECIPIENT_EMAIL_FULLSTACK }}
          RECIPIENT_EMAIL_JAVA: ${{ secrets.RECIPIENT_EMAIL_JAVA }}
          RECIPIENT_EMAIL_PLSQL: ${{ secrets.RECIPIENT_EMAIL_PLSQL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FORCE_DISPATCH: ${{ inputs.force_dispatch || 'false' }}
        run: npm start

      - name: Persist jobs.db and Web Portal Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(radar): update jobs.db and web portal dashboard"
            git push
          fi
